[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adrobot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
